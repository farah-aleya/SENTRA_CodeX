<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="DM Sans, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4670"/></marker>
    <style>
      .t{font-size:17px;font-weight:700;fill:#241a5e}.s{font-size:13.5px;fill:#4f4c6b}.k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#6c4cf1}
      .m{font-family:Consolas,monospace;font-size:13px;fill:#241a5e}
      .ln{stroke:#4a4670;stroke-width:2;fill:none;marker-end:url(#a)} .bi{stroke:#4a4670;stroke-width:2;fill:none;marker-end:url(#a);marker-start:url(#a)}
      .dl{stroke:#9a97b5;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#a)} .lab{font-size:12.5px;fill:#4a4670;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="40" y="52" font-size="28" font-weight="800" fill="#241a5e">SENTRA agent workflow</text>
  <text x="40" y="80" class="s">Perception (OpenCV 5) · decision (Claude Haiku 4.5 on Amazon Bedrock, tool use) · action (human approval or log). The visual evidence decides the next tool call.</text>

  <text x="40" y="130" class="k">1 · PERCEPTION</text>
  <rect x="40" y="145" width="260" height="120" rx="14" fill="#e2f8fb" stroke="#2cc4d6"/>
  <text x="58" y="175" class="t">Rule fires</text>
  <text x="58" y="199" class="s">cv.dnn detection + tracker +</text>
  <text x="58" y="219" class="s">zone rule (breach, loiter,</text>
  <text x="58" y="239" class="s">Away Mode, vehicle dwell)</text>

  <rect x="40" y="290" width="260" height="140" rx="14" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="58" y="320" class="t">Case opened</text>
  <text x="58" y="344" class="s">status REVIEWING</text>
  <text x="58" y="364" class="s">raw frames kept in memory only:</text>
  <text x="58" y="384" class="s">0.5 s before + 3 s after the event</text>
  <text x="58" y="404" class="s">(never written to disk)</text>
  <path class="ln" d="M170 265 V286"/>

  <text x="360" y="130" class="k">2 · DECISION (LOOP, UP TO 6 TURNS)</text>
  <rect x="360" y="145" width="330" height="285" rx="16" fill="#f0ecff" stroke="#6c4cf1" stroke-width="2"/>
  <text x="380" y="178" class="t">Agent · Bedrock Converse API</text>
  <text x="380" y="202" class="s">au.anthropic.claude-haiku-4-5</text>
  <text x="380" y="222" class="s">tool choice: must call a tool every turn</text>
  <text x="380" y="252" class="s">Brief: rule, severity, zone, object.</text>
  <text x="380" y="272" class="s">Only numbers and labels are sent,</text>
  <text x="380" y="292" class="s">never images or faces.</text>
  <text x="380" y="322" class="s">Reads each tool result, then decides</text>
  <text x="380" y="342" class="s">the next step: look again with</text>
  <text x="380" y="362" class="s">enhance=true, ask for context, or act.</text>
  <text x="380" y="398" class="s" font-weight="700">Fallback: Nova Lite, then local policy</text>
  <path class="ln" d="M300 360 H356"/>

  <text x="750" y="130" class="k">TOOLS</text>
  <rect x="750" y="145" width="380" height="120" rx="14" fill="#e2f8fb" stroke="#2cc4d6"/>
  <text x="768" y="175" class="t">recheck_region(window, enhance)</text>
  <text x="768" y="199" class="s">OpenCV 5: crop around the person, upscale,</text>
  <text x="768" y="219" class="s">CLAHE (night), cv.dnn re-detect on ~10 frames,</text>
  <text x="768" y="239" class="s">Farneback optical flow, movement toward zone</text>

  <rect x="750" y="280" width="380" height="70" rx="14" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="768" y="308" class="t">get_track_history()</text>
  <text x="768" y="330" class="s">dwell time, time tracked, people / vehicles in scene</text>
  <rect x="750" y="362" width="380" height="70" rx="14" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="768" y="390" class="t">get_zone_context()</text>
  <text x="768" y="412" class="s">zone, Away Mode, night, guard decisions here (24 h)</text>
  <path class="bi" d="M694 205 H746"/><path class="bi" d="M694 315 H746"/><path class="bi" d="M694 397 H746"/>

  <text x="1190" y="130" class="k">3 · ACTION</text>
  <rect x="1190" y="145" width="370" height="105" rx="14" fill="#fff4d6" stroke="#f2a03d"/>
  <text x="1208" y="175" class="t">Guardrails (code, not the model)</text>
  <text x="1208" y="199" class="s">must call recheck_region before acting</text>
  <text x="1208" y="219" class="s">HIGH alert + person in ≥30% of frames</text>
  <text x="1208" y="239" class="s">→ cannot be logged, goes to a human</text>

  <rect x="1190" y="280" width="370" height="70" rx="14" fill="#ffe9ef" stroke="#ff6f91"/>
  <text x="1208" y="308" class="t">request_human_approval</text>
  <text x="1208" y="330" class="s">PENDING · guard pop-up with clip + trace</text>
  <rect x="1190" y="362" width="370" height="70" rx="14" fill="#e6faf3" stroke="#3ddbb0"/>
  <text x="1208" y="390" class="t">log_only</text>
  <text x="1208" y="412" class="s">LOGGED · nobody disturbed, kept for audit</text>
  <path class="ln" d="M690 165 C 1000 100, 1150 110, 1186 170"/>
  <text x="980" y="108" class="lab">final tool call</text>
  <path class="ln" d="M1375 250 V276"/>

  <rect x="1190" y="460" width="370" height="105" rx="14" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="1208" y="490" class="t">Human in control</text>
  <text x="1208" y="514" class="s">Guard: Approve alarm → resident pop-up</text>
  <text x="1208" y="534" class="s">or Dismiss → feeds get_zone_context</text>
  <text x="1208" y="554" class="s">for future cases in the same zone</text>
  <path class="ln" d="M1560 315 C 1595 315, 1595 512, 1564 512"/>

  <text x="40" y="500" class="k">OBSERVABILITY</text>
  <rect x="40" y="515" width="650" height="90" rx="14" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="58" y="545" class="s">Every step saved: tool call, input, result, model, timings, guardrail. Stored per case in the</text>
  <text x="58" y="565" class="s">database (shown to the guard as "How the agent decided"), in outputs/agent_trace.jsonl,</text>
  <text x="58" y="585" class="s">and as CloudWatch metrics: AgentDecision, AgentLatency, GuardrailOverride, GuardDecision.</text>

  <text x="40" y="650" class="k">REAL TRACE · CASE 83a5db7a · CAM 01 MAIN GATE (NIGHT IR) · LOITERING · CLAUDE HAIKU 4.5 ON BEDROCK</text>
  <rect x="40" y="665" width="1520" height="200" rx="14" fill="#141133"/>
  <text x="62" y="698" class="m" style="fill:#7ff0d0">1 recheck_region(window_seconds=2)</text><text x="470" y="698" class="m" style="fill:#d9d5ff">→ person in 10/10 frames, mean conf 0.68, moving</text>
  <text x="62" y="724" class="m" style="fill:#9cc8ff">2 get_track_history()</text><text x="470" y="724" class="m" style="fill:#d9d5ff">→ 6.0 s in zone, 1 person in scene</text>
  <text x="62" y="750" class="m" style="fill:#9cc8ff">3 get_zone_context()</text><text x="470" y="750" class="m" style="fill:#d9d5ff">→ house zone "Front of No. 8", Away Mode off, no past alerts</text>
  <text x="62" y="776" class="m" style="fill:#7ff0d0">4 recheck_region(window_seconds=3, enhance=true)</text><text x="470" y="776" class="m" style="fill:#d9d5ff">       → 11/11 frames, max conf 0.87, fast motion (agent chose to look again)</text>
  <text x="62" y="802" class="m" style="fill:#ffb3c4">5 request_human_approval(MEDIUM)</text><text x="470" y="802" class="m" style="fill:#d9d5ff">"Person loitering at front of No. 8 for 6 seconds; confirmed in 11/11 frames ..."</text>
  <text x="62" y="836" class="m" style="fill:#a19eb9">→ PENDING · guard pop-up · decided in 8.8 s · full trace stored with the case</text>
</svg>
