<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" font-family="DM Sans, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4670"/></marker>
    <style>
      .t{font-size:17px;font-weight:700;fill:#241a5e}.s{font-size:13.5px;fill:#4f4c6b}.k{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#6c4cf1}
      .ln{stroke:#4a4670;stroke-width:2;fill:none;marker-end:url(#a)} .dl{stroke:#4a4670;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#a)}
      .lab{font-size:12.5px;fill:#4a4670;font-weight:600}
    </style>
  </defs>
  <rect width="1600" height="940" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="800" fill="#241a5e">SENTRA architecture</text>
  <text x="40" y="80" class="s">OpenCV 5 perception and an agent on Amazon Bedrock, deployed on AWS (ap-southeast-2, Sydney). Nothing escalates without a human.</text>

  <!-- cameras -->
  <rect x="40" y="300" width="170" height="150" rx="16" fill="#f4f6fb" stroke="#d9d7ea"/>
  <text x="125" y="345" text-anchor="middle" class="t">Township CCTV</text>
  <text x="125" y="370" text-anchor="middle" class="s">existing cameras</text>
  <text x="125" y="390" text-anchor="middle" class="s">RTSP / video files</text>
  <text x="125" y="410" text-anchor="middle" class="s">(demo: recorded clips)</text>

  <!-- AWS cloud -->
  <rect x="240" y="98" width="925" height="810" rx="26" fill="none" stroke="#f2a03d" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1150" y="122" text-anchor="end" class="k" fill="#b45309" style="fill:#b45309">AWS CLOUD · ap-southeast-2 (Sydney)</text>
  <!-- EC2 -->
  <rect x="255" y="130" width="895" height="510" rx="22" fill="#fbfaff" stroke="#6c4cf1" stroke-width="2"/>
  <text x="275" y="152" class="k">AMAZON EC2 · m7i-flex.large · Ubuntu 24.04 · IAM role (no keys on disk)</text>

  <!-- cameras service -->
  <rect x="275" y="162" width="560" height="465" rx="16" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="295" y="190" class="k">SENTRA-CAMERAS · ONE PROCESS PER CAMERA</text>

  <g>
    <rect x="295" y="205" width="250" height="78" rx="12" fill="#e2f8fb" stroke="#2cc4d6"/>
    <text x="310" y="232" class="t">Detect</text>
    <text x="310" y="254" class="s">YOLOv8n ONNX in cv.dnn (OpenCV 5</text>
    <text x="310" y="272" class="s">new engine), NMSBoxesBatched</text>

    <rect x="565" y="205" width="250" height="78" rx="12" fill="#e2f8fb" stroke="#2cc4d6"/>
    <text x="580" y="232" class="t">Track + zones + rules</text>
    <text x="580" y="254" class="s">IoU tracker, pointPolygonTest:</text>
    <text x="580" y="272" class="s">breach, loiter, Away Mode, vehicle</text>

    <rect x="295" y="300" width="250" height="78" rx="12" fill="#e2f8fb" stroke="#2cc4d6"/>
    <text x="310" y="327" class="t">Privacy blur</text>
    <text x="310" y="349" class="s">FaceDetectorYN (YuNet) + head</text>
    <text x="310" y="367" class="s">pixelation before any frame is saved</text>

    <rect x="565" y="300" width="250" height="78" rx="12" fill="#e2f8fb" stroke="#2cc4d6"/>
    <text x="580" y="327" class="t">Camera health</text>
    <text x="580" y="349" class="s">Laplacian detail, frame difference:</text>
    <text x="580" y="367" class="s">blocked, frozen, offline</text>
  </g>

  <!-- agent box -->
  <rect x="295" y="400" width="520" height="210" rx="14" fill="#f0ecff" stroke="#6c4cf1"/>
  <text x="315" y="428" class="k">AGENT LOOP (PERCEPTION · DECISION · ACTION)</text>
  <text x="315" y="456" class="t">Case opened when a rule fires</text>
  <text x="315" y="480" class="s">Tools the agent can call, as many times as it needs:</text>
  <text x="330" y="503" class="s">• recheck_region: crop, upscale, CLAHE, cv.dnn re-detect,</text>
  <text x="345" y="521" class="s">Farneback optical flow over the next 3 s (OpenCV 5)</text>
  <text x="330" y="543" class="s">• get_track_history · get_zone_context (guard feedback, Away Mode)</text>
  <text x="315" y="569" class="t" font-size="15">Actions: request_human_approval · log_only</text>
  <text x="315" y="592" class="s">Guardrails in code: must re-check first; HIGH + person cannot be logged</text>

  <!-- arrows inside -->
  <path class="ln" d="M545 244 H560"/>
  <path class="ln" d="M690 283 V296"/>
  <path class="ln" d="M420 283 V296"/>
  <path class="ln" d="M690 378 V396"/>

  <!-- data -->
  <rect x="860" y="160" width="265" height="120" rx="16" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="880" y="192" class="t">SQLite</text>
  <text x="880" y="216" class="s">cases, agent decisions + traces,</text>
  <text x="880" y="236" class="s">accounts (PBKDF2), Away Mode,</text>
  <text x="880" y="256" class="s">camera status</text>

  <rect x="860" y="300" width="265" height="190" rx="16" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="880" y="332" class="t">sentra-web (FastAPI)</text>
  <text x="880" y="356" class="s">sign-up / login, roles</text>
  <text x="880" y="376" class="s">live pop-ups (Server-Sent Events)</text>
  <text x="880" y="396" class="s">Approve alarm / Dismiss</text>
  <text x="880" y="416" class="s">agent trace viewer</text>
  <text x="880" y="436" class="s">access-checked clips</text>
  <text x="880" y="456" class="s">resident Away Mode switch</text>

  <rect x="860" y="510" width="265" height="100" rx="16" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="880" y="542" class="t">Caddy</text>
  <text x="880" y="566" class="s">HTTPS (Let's Encrypt),</text>
  <text x="880" y="586" class="s">security headers</text>

  <path class="ln" d="M835 230 H856"/>
  <path class="ln" d="M992 280 V296"/>
  <path class="ln" d="M992 490 V506"/>

  <!-- aws managed -->
  <text x="275" y="676" class="k">AWS MANAGED SERVICES</text>
  <rect x="275" y="685" width="270" height="190" rx="16" fill="#fff4d6" stroke="#f2a03d"/>
  <text x="295" y="717" class="t">Amazon Bedrock</text>
  <text x="295" y="741" class="s">Claude Haiku 4.5 (au. inference</text>
  <text x="295" y="761" class="s">profile, data stays in Australia)</text>
  <text x="295" y="781" class="s">Converse API with tool use</text>
  <text x="295" y="801" class="s">Fallback: Amazon Nova Lite,</text>
  <text x="295" y="821" class="s">then a local policy</text>
  <text x="295" y="849" class="s" font-weight="700">Only numbers and labels are sent.</text>

  <rect x="565" y="685" width="270" height="190" rx="16" fill="#e6faf3" stroke="#3ddbb0"/>
  <text x="585" y="717" class="t">Amazon S3</text>
  <text x="585" y="741" class="s">blurred snapshots + 10 s clips</text>
  <text x="585" y="761" class="s">encrypted (SSE), private</text>
  <text x="585" y="781" class="s">lifecycle: deleted after 7 days</text>
  <text x="585" y="801" class="s">served via short-lived</text>
  <text x="585" y="821" class="s">presigned links</text>

  <rect x="855" y="685" width="270" height="190" rx="16" fill="#ffe9ef" stroke="#ff6f91"/>
  <text x="875" y="717" class="t">Amazon CloudWatch</text>
  <text x="875" y="741" class="s">namespace SENTRA:</text>
  <text x="875" y="761" class="s">RuleFired, AgentDecision,</text>
  <text x="875" y="781" class="s">AgentLatency, GuardrailOverride,</text>
  <text x="875" y="801" class="s">GuardDecision, GuardResponseTime,</text>
  <text x="875" y="821" class="s">CameraFPS</text>

  <path class="dl" d="M470 610 V681"/><text x="478" y="662" class="lab">Converse API</text>
  <path class="dl" d="M700 627 V681"/><text x="708" y="662" class="lab">upload</text>
  <path class="dl" d="M790 627 C 810 660, 930 650, 990 681"/><text x="880" y="662" class="lab">metrics</text>

  <!-- cameras to EC2 -->
  <path class="ln" d="M210 375 H290"/>

  <!-- users -->
  <rect x="1220" y="250" width="330" height="150" rx="16" fill="#f4f6fb" stroke="#d9d7ea"/>
  <text x="1240" y="284" class="t">Guard (browser)</text>
  <text x="1240" y="308" class="s">pop-up with clip, agent summary</text>
  <text x="1240" y="328" class="s">and step-by-step trace</text>
  <text x="1240" y="352" class="s">decides: Approve alarm / Dismiss</text>
  <text x="1240" y="376" class="s">invite code to register</text>

  <rect x="1220" y="450" width="330" height="150" rx="16" fill="#f4f6fb" stroke="#d9d7ea"/>
  <text x="1240" y="484" class="t">Resident (browser)</text>
  <text x="1240" y="508" class="s">sees only guard-confirmed alerts</text>
  <text x="1240" y="528" class="s">for their house + safety advice</text>
  <text x="1240" y="552" class="s">turns Away Mode on / off</text>

  <path class="ln" d="M1125 560 C 1170 560, 1170 330, 1214 330"/>
  <path class="ln" d="M1125 560 C 1170 560, 1170 525, 1214 525"/>
  <text x="1185" y="430" class="lab">HTTPS</text>

  <rect x="1220" y="660" width="330" height="215" rx="16" fill="#ffffff" stroke="#d9d7ea"/>
  <text x="1240" y="692" class="k">FLOW OF ONE ALERT</text>
  <text x="1240" y="720" class="s">1. Rule fires, case opened (REVIEWING)</text>
  <text x="1240" y="744" class="s">2. Agent re-checks with OpenCV 5 tools</text>
  <text x="1240" y="768" class="s">3a. log_only: LOGGED, nobody disturbed</text>
  <text x="1240" y="792" class="s">3b. request_human_approval: PENDING</text>
  <text x="1240" y="816" class="s">4. Guard approves: CONFIRMED</text>
  <text x="1240" y="840" class="s">5. Resident pop-up</text>
</svg>
